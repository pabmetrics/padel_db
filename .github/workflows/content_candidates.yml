name: content_candidates

on:
  # Doc 01 §5: diario, justo después de ingest_torneo_previa (07:00). Encadenado
  # en vez de con cron propio porque GitHub dispara los cron con horas de
  # retraso y en otro orden: el 27/09 corrió antes que la previa y no vio el
  # cuadro de Rotterdam P2.
  workflow_run:
    workflows: [ingest_torneo_previa]
    types: [completed]
  workflow_dispatch:
    inputs:
      serie:
        description: "Solo esta serie, fuera del calendario del día (p. ej. torneo_previa). Vacío = las que tocan hoy"
        required: false
        default: ""

concurrency:
  group: cola  # comparte el contador de registro con adhoc_chart
  cancel-in-progress: false

jobs:
  content_candidates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar candidatos (gráfico + texto + cola)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERIE: ${{ inputs.serie }}
        run: python -m content.copy_factory.candidatos ${SERIE:+--serie "$SERIE"}

      # Aunque un candidato falle (el job queda en rojo y salta la alerta),
      # se guardan los que sí se generaron.
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "padeldb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add queue/ content/chart_factory/registro.json
          git diff --cached --quiet || git commit -m "content_candidates: $(date -u +%F)"
          for intento in 1 2 3 4 5; do
            git push && break
            echo "push rechazado (otro job empujo a la vez), reintento con rebase ($intento/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 10) + 1 ))
          done
