name: ingest_padelfip

on:
  schedule:
    # Lunes 06:45 hora española, entre F1 (06:00) y F2 (06:30+ejecución) — doc 01 §5
    - cron: "45 5 * * 1"
  workflow_dispatch: {}

jobs:
  ingest_padelfip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ingesta F3 (ranking oficial, top 10 M/F, padelfip.com)
        run: python -m ingest.padelfip.ranking

      - name: Commit del nuevo snapshot
        run: |
          git config user.name "padeldb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bronze/padelfip
          git diff --cached --quiet || git commit -m "ingest_padelfip: snapshot semanal $(date -u +%F)"
          for intento in 1 2 3 4 5; do
            git push && break
            echo "push rechazado (otro job empujo a la vez), reintento con rebase ($intento/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 10) + 1 ))
          done
