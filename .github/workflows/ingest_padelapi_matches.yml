name: ingest_padelapi_matches

on:
  schedule:
    # Lunes 07:15, tras ingest_padelapi (07:30 en el otro workflow — ver nota)
    # Nota: horario ajustado para no solapar con ingest_padelapi.yml.
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      days_back:
        description: "Días hacia atrás a considerar (backfill puntual con más rango si hace falta)"
        default: "14"

jobs:
  ingest_padelapi_matches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ingesta de partidos por torneo reciente (F2)
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
        run: python -m ingest.padelapi.matches --days-back "${{ github.event.inputs.days_back || '14' }}"

      - name: Commit del nuevo snapshot
        run: |
          git config user.name "padeldb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bronze/padelapi/matches
          git diff --cached --quiet || git commit -m "ingest_padelapi_matches: $(date -u +%F)"
          for intento in 1 2 3 4 5; do
            git push && break
            echo "push rechazado (otro job empujo a la vez), reintento con rebase ($intento/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $(( (RANDOM % 10) + 1 ))
          done
