name: probar_race

# Prueba puntual, solo a mano: ¿da padelapi el ranking Race de las Finals?
# No guarda ni sube nada; el resultado sale en el resumen del job.
# Ver ingest/padelapi/probar_race.py.

on:
  workflow_dispatch: {}

jobs:
  probar_race:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pedir el ranking Race a padelapi
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
        run: python -m ingest.padelapi.probar_race
