name: ingest_padelapi

on:
  schedule:
    # Lunes 07:30 hora española, media hora después de ingest_ranking (doc 01 §5)
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

jobs:
  ingest_padelapi:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ingesta F2 (rankings + players de padelapi.org)
        env:
          PADEL_API_TOKEN: ${{ secrets.PADEL_API_TOKEN }}
        run: python -m ingest.padelapi.snapshot --what both --max-pages 60

      - name: Commit del nuevo snapshot
        run: |
          git config user.name "padeldb-bot"
          git config user.email "actions@users.noreply.github.com"
          git add bronze/padelapi
          git diff --cached --quiet || git commit -m "ingest_padelapi: snapshot semanal $(date -u +%F)"
          git push
